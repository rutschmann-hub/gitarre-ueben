<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gitarrenübungen</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .card-icon {
      font-size: 1.6rem;
      display: block;
      margin-bottom: 0.5rem;
    }
    .card-arrow {
      display: inline-block;
      color: var(--text3);
      font-size: 0.9rem;
      margin-top: 0.5rem;
      transition: transform var(--transition), color var(--transition);
    }
    .card-link:hover .card-arrow {
      transform: translateX(3px);
      color: var(--accent);
    }
    .app-name {
      font-size: 1.35rem;
    }
  </style>
</head>
<body>

<header class="app-header">
  <div class="app-header-inner">
    <span class="header-title app-name">Gitarrenübungen</span>
    <span class="sync-status" id="syncStatus"></span>
  </div>
</header>

<main class="main">
  <div class="container">

    <div class="page-hero">
      <h1 class="page-hero-title">Übungsplan</h1>
      <p class="page-hero-subtitle">Wähle eine Kategorie zum Üben</p>
    </div>


    <div class="card-grid" id="cardGrid">
      <div class="card" style="border-style:dashed; animation: blink 1.4s ease-in-out infinite; color:var(--text3); text-align:center; padding:2rem;">
        Lädt…
      </div>
    </div>

  </div>
</main>


<script src="assets/sheet-api.js"></script>
<script>
  const PAGES = [
    {
      key:   'sequenzen',
      title: 'Übungssequenzen',
      desc:  'Schritt-für-Schritt-Pläne zum Abhaken und Nachverfolgen',
      href:  'ueben/sequenzen.html',
      icon:  '📋',
      label: 'Üben',
    },
    {
      key:      'bandit',
      title:    'Akkord Bandit',
      desc:     'Permutationstrainer für Vierklänge – dom7, maj7, moll7, moll7b5, dim7',
      href:     'akkord-bandit.html',
      icon:     '🎲',
      label:    'Tool',
      hinweis:  'Slot-Maschine mit Griffbrett',
    },
    {
      key:      'fortschritt',
      title:    'Fortschritt',
      desc:     'Geübte Durchgänge pro Akkordtyp und Tonart',
      href:     'fortschritt.html',
      icon:     '✅',
      label:    'Track',
      hinweis:  'Zähler aus dem Akkord Bandit',
    },
    {
      key:      'protokoll',
      title:    'Protokoll',
      desc:     'Übungstagebuch mit 24 Zeilen',
      href:     'protokoll.html',
      icon:     '📝',
      label:    'Track',
      hinweis:  'Nur auf diesem Gerät gespeichert',
    },
    {
      key:      'skalen',
      title:    'Skalen',
      desc:     'Tonleitern und Läufe in allen Lagen',
      href:     'ueben/skalen.html',
      icon:     '🎵',
      label:    'Üben',
      hinweis:  'In Arbeit',
    },
    {
      key:      'akkorde',
      title:    'Akkorde',
      desc:     'Grifftabellen und Wechselübungen',
      href:     'ueben/akkorde.html',
      icon:     '🤘',
      label:    'Üben',
      hinweis:  'In Arbeit',
    },
  ];

  let sequenzen = null;

  // ── Progress helpers ──────────────────────────────────────────────────
  function countProgress(section) {
    if (!section || typeof section !== 'object') return { done: 0, total: 0 };
    let done = 0, total = 0;
    for (const seq of Object.values(section)) {
      for (const item of Object.values(seq.items || {})) {
        total++;
        if (item.done) done++;
      }
    }
    return { done, total };
  }

  // ── Render cards ──────────────────────────────────────────────────────
  function renderCards() {
    const grid = document.getElementById('cardGrid');
    grid.innerHTML = PAGES.map(page => {
      const { done, total } = page.key === 'sequenzen'
        ? countProgress(sequenzen)
        : { done: 0, total: 0 };
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;

      const progressHtml = total > 0
        ? `<div class="progress-wrap" style="margin-top:0.6rem">
            <div class="progress-bar">
              <div class="progress-bar-fill" style="width:${pct}%"></div>
            </div>
            <span class="progress-label">${done}/${total}</span>
           </div>`
        : `<span class="text-xs text-muted">${page.hinweis || 'Noch keine Übungen'}</span>`;

      return `
        <a class="card card-link" href="${page.href}">
          <span class="card-icon">${page.icon}</span>
          <div class="card-label">${page.label}</div>
          <div class="card-title">${page.title}</div>
          <div class="card-desc">${page.desc}</div>
          ${progressHtml}
          <span class="card-arrow">→</span>
        </a>
      `;
    }).join('');
  }

  // ── Sync status ───────────────────────────────────────────────────────
  function setSyncStatus(state, text) {
    const el = document.getElementById('syncStatus');
    el.className = `sync-status ${state}`;
    el.textContent = text;
  }

  // ── Init ──────────────────────────────────────────────────────────────
  // Sequenzen-Seite schreibt lokal zuerst; solange dort etwas nicht
  // hochgeladen ist (dirty), ist der lokale Stand der aktuellere.
  async function init() {
    try { sequenzen = JSON.parse(localStorage.getItem('gitueben_sequenzen') || 'null'); } catch (e) {}
    renderCards();
    if (localStorage.getItem('gitueben_sequenzen_dirty')) {
      setSyncStatus('dirty', '○ Nicht alles synchronisiert');
      return;
    }
    setSyncStatus('saving', '⟳ Lädt…');
    const remote = await SheetAPI.load();
    if (!remote) { setSyncStatus('offline', '◌ Offline'); return; }
    sequenzen = remote.sequenzen || {};
    localStorage.setItem('gitueben_sequenzen', JSON.stringify(sequenzen));
    renderCards();
    setSyncStatus('synced', '✓ Synchronisiert');
  }

  window.addEventListener('offline', () => setSyncStatus('offline', '◌ Offline'));

  init();
</script>
</body>
</html>
